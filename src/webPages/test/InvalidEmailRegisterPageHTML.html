<!DOCTYPE html>
<html lang="en">
<head>

  <title>Invalid Email Register Sample</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
