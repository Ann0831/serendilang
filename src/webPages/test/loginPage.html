<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Serendilang</title>
  <link rel="stylesheet" href="../../src/assets/css/tabler-icons.min.css" />
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f3f8ff 0%, #ffffff 100%);
      color: #111827;
    }
    .card {
      width: min(92vw, 420px);
      background: #ffffff;
      border: 1px solid #dbe7ff;
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 18px;
      color: #4b5563;
      line-height: 1.4;
    }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 6px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 0;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-sizing: border-box;
    }
    .footer {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #6b7280;
      text-align: center;
    }
    .footer a {
      color: #1d4ed8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="login-title">Login</h1>
    <p id="login-subtitle">Continue with your Google account.</p>
    <a id="login-google-btn" class="btn" href="/login/oauth/google">
      <i class="ti ti-brand-google" aria-hidden="true"></i>
      <span id="login-google-text">Login with Google</span>
    </a>
    <div id="login-footer" class="footer">
      <span id="login-footer-prefix">No account?</span>
      <a id="login-register-link" href="/register">Go to Register</a>
    </div>
  </main>
  <script>
    (function () {
      const isZh = typeof navigator !== "undefined" && String(navigator.language || "").toLowerCase().startsWith("zh");
      if (!isZh) return;
      const byId = (id) => document.getElementById(id);
      document.title = "登入 - Serendilang";
      const title = byId("login-title");
      const subtitle = byId("login-subtitle");
      const googleText = byId("login-google-text");
      const footerPrefix = byId("login-footer-prefix");
      const registerLink = byId("login-register-link");
      if (title) title.textContent = "登入";
      if (subtitle) subtitle.textContent = "使用你的 Google 帳號繼續。";
      if (googleText) googleText.textContent = "使用 Google 登入";
      if (footerPrefix) footerPrefix.textContent = "還沒有帳號？";
      if (registerLink) registerLink.textContent = "前往註冊";
    })();
  </script>
  <script type="module" src="../../src/webPageInit/initTopBar.js"></script>
</body>
</html>
