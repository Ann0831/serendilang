<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Serendilang</title>
  <link rel="stylesheet" href="../../src/assets/css/tabler-icons.min.css" />
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f5fff5 0%, #ffffff 100%);
      color: #111827;
    }
    .card {
      width: min(92vw, 420px);
      background: #ffffff;
      border: 1px solid #d7f3df;
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 18px;
      color: #4b5563;
      line-height: 1.4;
    }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 6px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 0;
      background: #16a34a;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-sizing: border-box;
    }
    .footer {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #6b7280;
      text-align: center;
    }
    .footer a {
      color: #166534;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="register-title">Register</h1>
    <p id="register-subtitle">Create your account with Google OAuth.</p>
    <a id="register-google-btn" class="btn" href="/register/oauth/google">
      <i class="ti ti-brand-google" aria-hidden="true"></i>
      <span id="register-google-text">Register with Google</span>
    </a>
    <div class="footer">
      <span id="register-footer-prefix">Already have an account?</span>
      <a id="register-login-link" href="/login">Go to Login</a>
    </div>
  </main>
  <script>
    (function () {
      const isZh = typeof navigator !== "undefined" && String(navigator.language || "").toLowerCase().startsWith("zh");
      if (!isZh) return;
      const byId = (id) => document.getElementById(id);
      document.title = "註冊 - Serendilang";
      const title = byId("register-title");
      const subtitle = byId("register-subtitle");
      const googleText = byId("register-google-text");
      const footerPrefix = byId("register-footer-prefix");
      const loginLink = byId("register-login-link");
      if (title) title.textContent = "註冊";
      if (subtitle) subtitle.textContent = "使用 Google OAuth 建立你的帳號。";
      if (googleText) googleText.textContent = "使用 Google 註冊";
      if (footerPrefix) footerPrefix.textContent = "已經有帳號？";
      if (loginLink) loginLink.textContent = "前往登入";
    })();
  </script>
  <script type="module" src="../../src/webPageInit/initTopBar.js"></script>
</body>
</html>
