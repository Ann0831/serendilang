<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">Open In Browser</title>
  <link rel="icon" href="/sourcecode/assets/favicon-BjzQ4Qxh.png" type="image/png" />
</head>
<body style="margin:0;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <section style="max-width:560px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,0.08);padding:28px 24px;">
      <h1 data-i18n="heading" style="margin:0 0 12px;font-size:24px;line-height:1.3;">Open This Page In Your Browser</h1>
      <p data-i18n="desc1" style="margin:0 0 10px;line-height:1.7;color:#334155;">
        This action cannot continue inside an in-app browser.
      </p>
      <p data-i18n="desc2" style="margin:0;line-height:1.7;color:#334155;">
        Please tap the menu and choose <strong>Open in Browser</strong>, then retry.
      </p>
    </section>
  </main>
  <script>
    (function () {
      const messages = {
        en: {
          title: "Open In Browser",
          heading: "Open This Page In Your Browser",
          desc1: "This action cannot continue inside an in-app browser.",
          desc2: "Please tap the menu and choose <strong>Open in Browser</strong>, then retry.",
        },
        zh: {
          title: "請在瀏覽器中開啟",
          heading: "請使用瀏覽器開啟此頁面",
          desc1: "此操作無法在 App 內建瀏覽器中繼續。",
          desc2: "請點選選單並選擇 <strong>在瀏覽器中開啟</strong>，再重試一次。",
        },
      };

      const raw = String(navigator.language || navigator.userLanguage || "").toLowerCase();
      const locale = raw.startsWith("zh") ? "zh" : "en";
      document.documentElement.lang = locale;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        const text = messages[locale] && messages[locale][key];
        if (!text) return;
        if (el.tagName.toLowerCase() === "title" || text.indexOf("<strong>") === -1) {
          el.textContent = text;
          return;
        }
        el.innerHTML = text;
      });
    })();
  </script>
</body>
</html>
